<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Description 清洗人工打标</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }

  /* ── 顶部导航 ── */
  .topbar {
    background: #1a1a2e; color: #fff; padding: 12px 24px;
    display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .topbar h1 { font-size: 15px; font-weight: 600; flex: 1; }
  .counter { font-size: 13px; color: #aaa; }
  .progress-wrap { flex: 1; max-width: 200px; }
  .progress-bar { height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: #4ade80; transition: width .3s; border-radius: 3px; }
  .btn-nav {
    padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: all .15s;
  }
  .btn-nav:hover { transform: translateY(-1px); }
  .btn-prev { background: #374151; color: #e5e7eb; }
  .btn-next { background: #3b82f6; color: #fff; }
  .btn-export { background: #10b981; color: #fff; margin-left: 8px; }

  /* ── 商品信息条 ── */
  .item-info {
    background: #fff; border-bottom: 1px solid #e5e7eb;
    padding: 10px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600; letter-spacing: .3px;
  }
  .badge-region { background: #dbeafe; color: #1e40af; }
  .badge-reduction { background: #fef3c7; color: #92400e; }
  .badge-reduction.high { background: #fee2e2; color: #991b1b; }
  .item-title { font-size: 13px; color: #374151; font-weight: 500; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-cat { font-size: 11px; color: #9ca3af; }

  /* ── 主内容区 ── */
  .main { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: calc(100vh - 140px); }

  .panel {
    display: flex; flex-direction: column; border-right: 1px solid #e5e7eb;
    background: #fff;
  }
  .panel:last-child { border-right: none; }

  .panel-header {
    padding: 10px 16px; font-size: 12px; font-weight: 700; letter-spacing: .5px;
    border-bottom: 2px solid; display: flex; align-items: center; gap: 8px;
    position: sticky; top: 0; background: inherit;
  }
  .panel-header.orig { border-color: #6366f1; color: #4338ca; background: #eef2ff; }
  .panel-header.clean { border-color: #10b981; color: #065f46; background: #ecfdf5; }

  .char-count { font-size: 11px; font-weight: 400; color: #6b7280; margin-left: auto; }

  .panel-body { flex: 1; overflow-y: auto; padding: 16px; line-height: 1.75; font-size: 13px; }

  /* 高亮删除的行 */
  .line-removed { background: #fee2e2; color: #991b1b; text-decoration: line-through;
    border-radius: 3px; padding: 1px 3px; display: block; margin: 2px 0; }
  .line-kept    { display: block; margin: 2px 0; }
  .line-empty   { height: 10px; display: block; }

  /* ── 打标区 ── */
  .label-panel {
    background: #f9fafb; border-top: 1px solid #e5e7eb;
    padding: 14px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .label-title { font-size: 12px; color: #6b7280; font-weight: 600; white-space: nowrap; }

  .label-btn {
    padding: 6px 14px; border-radius: 20px; border: 2px solid transparent;
    font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s;
    background: #f3f4f6; color: #374151;
  }
  .label-btn:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .label-btn.selected { color: #fff; transform: translateY(-1px); }
  .label-btn[data-val="correct"].selected   { background: #10b981; border-color: #059669; }
  .label-btn[data-val="minor"].selected     { background: #f59e0b; border-color: #d97706; }
  .label-btn[data-val="miss_info"].selected { background: #ef4444; border-color: #dc2626; }
  .label-btn[data-val="over_clean"].selected{ background: #8b5cf6; border-color: #7c3aed; }
  .label-btn[data-val="skip"].selected      { background: #6b7280; border-color: #4b5563; }

  .note-input {
    flex: 1; min-width: 200px; padding: 6px 10px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 12px; outline: none; background: #fff;
  }
  .note-input:focus { border-color: #3b82f6; }

  .stats-bar {
    background: #1a1a2e; color: #9ca3af; font-size: 11px;
    padding: 6px 24px; display: flex; gap: 16px;
  }
  .stats-item { display: flex; align-items: center; gap: 4px; }
  .stats-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* 键盘提示 */
  .kbd { display: inline-block; background: #374151; color: #d1d5db;
    padding: 1px 5px; border-radius: 4px; font-size: 10px; font-family: monospace; }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar">
  <h1>🔍 Description 清洗人工打标</h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <span class="counter" id="counter">0 / 0</span>
  <button class="btn-nav btn-prev" onclick="navigate(-1)">← 上一条</button>
  <button class="btn-nav btn-next" onclick="navigate(1)">下一条 →</button>
  <button class="btn-nav btn-export" onclick="exportResults()">📥 导出结果</button>
</div>

<!-- 商品信息 -->
<div class="item-info">
  <span class="badge badge-region" id="badgeRegion">-</span>
  <span class="item-title" id="itemTitle">-</span>
  <span class="badge badge-reduction" id="badgeReduction">-</span>
  <span class="item-cat" id="itemCat">-</span>
</div>

<!-- 主内容 -->
<div class="main">
  <!-- 原始 -->
  <div class="panel">
    <div class="panel-header orig">
      📄 原始 Description
      <span class="char-count" id="origLen">-</span>
    </div>
    <div class="panel-body" id="origBody"></div>
  </div>
  <!-- 清洗后 -->
  <div class="panel">
    <div class="panel-header clean">
      ✨ 清洗后 Description
      <span class="char-count" id="cleanLen">-</span>
    </div>
    <div class="panel-body" id="cleanBody"></div>
  </div>
</div>

<!-- 打标区 -->
<div class="label-panel">
  <span class="label-title">打标：</span>
  <button class="label-btn" data-val="correct"   onclick="setLabel('correct')">✅ 清洗正确</button>
  <button class="label-btn" data-val="minor"     onclick="setLabel('minor')">⚠️ 轻微问题</button>
  <button class="label-btn" data-val="miss_info" onclick="setLabel('miss_info')">❌ 漏删信息</button>
  <button class="label-btn" data-val="over_clean" onclick="setLabel('over_clean')">🔴 过度清洗</button>
  <button class="label-btn" data-val="skip"      onclick="setLabel('skip')">⏭ 跳过</button>
  <input class="note-input" id="noteInput" placeholder="备注（可选）" oninput="saveNote()" />
  <span style="font-size:11px;color:#9ca3af;white-space:nowrap">
    键盘：<span class="kbd">1</span>正确 <span class="kbd">2</span>轻微
    <span class="kbd">3</span>漏信 <span class="kbd">4</span>过度 <span class="kbd">5</span>跳过
    <span class="kbd">←→</span>翻页
  </span>
</div>

<!-- 统计条 -->
<div class="stats-bar" id="statsBar"></div>

<script>
let DATA = [];
let labels = {};  // id -> {label, note}
let current = 0;

// ── 加载数据 ──
fetch('annotation_data.json')
  .then(r => r.json())
  .then(d => {
    DATA = d;
    // 尝试恢复本地存储
    const saved = localStorage.getItem('ksp_labels');
    if (saved) labels = JSON.parse(saved);
    render();
  })
  .catch(e => {
    document.body.innerHTML = '<div style="padding:40px;color:red">无法加载 annotation_data.json，请确保文件在同目录</div>';
  });

// ── 渲染 ──
function render() {
  const item = DATA[current];
  if (!item) return;

  // 信息栏
  document.getElementById('badgeRegion').textContent = item.region;
  document.getElementById('itemTitle').textContent = item.title;
  const pct = Math.round(item.reduction * 100);
  const redBadge = document.getElementById('badgeReduction');
  redBadge.textContent = `删除 ${pct}%`;
  redBadge.className = 'badge badge-reduction' + (pct >= 30 ? ' high' : '');
  document.getElementById('itemCat').textContent = item.category.split('->').slice(-2).join(' > ');

  // 进度
  const done = Object.keys(labels).length;
  const total = DATA.length;
  document.getElementById('counter').textContent = `${current + 1} / ${total}（已标 ${done}）`;
  document.getElementById('progressFill').style.width = (done / total * 100) + '%';

  // 内容对比 - diff 高亮
  const origLines = item.original.split('\n');
  const cleanLines = new Set(item.cleaned.split('\n'));

  // 原始：标记哪些行被删了
  let origHtml = '';
  for (const line of origLines) {
    if (!line.trim()) { origHtml += '<span class="line-empty"></span>'; continue; }
    if (!cleanLines.has(line)) {
      origHtml += `<span class="line-removed">${esc(line)}</span>`;
    } else {
      origHtml += `<span class="line-kept">${esc(line)}</span>`;
    }
  }
  document.getElementById('origBody').innerHTML = origHtml;
  document.getElementById('origLen').textContent = `${item.orig_len} chars`;

  // 清洗后
  let cleanHtml = item.cleaned.split('\n')
    .map(l => l.trim() ? `<span class="line-kept">${esc(l)}</span>` : '<span class="line-empty"></span>')
    .join('');
  document.getElementById('cleanBody').innerHTML = cleanHtml;
  document.getElementById('cleanLen').textContent = `${item.clean_len} chars`;

  // 恢复标签
  const entry = labels[item.id] || {};
  document.querySelectorAll('.label-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.val === entry.label);
  });
  document.getElementById('noteInput').value = entry.note || '';

  updateStats();
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── 导航 ──
function navigate(dir) {
  current = Math.max(0, Math.min(DATA.length - 1, current + dir));
  render();
  // 滚回顶
  document.getElementById('origBody').scrollTop = 0;
  document.getElementById('cleanBody').scrollTop = 0;
}

// ── 打标 ──
function setLabel(val) {
  const item = DATA[current];
  if (!labels[item.id]) labels[item.id] = {};
  labels[item.id].label = val;
  labels[item.id].note  = document.getElementById('noteInput').value;
  localStorage.setItem('ksp_labels', JSON.stringify(labels));
  render();
  // 自动跳到下一条
  if (val !== 'skip' && current < DATA.length - 1) {
    setTimeout(() => navigate(1), 300);
  }
}

function saveNote() {
  const item = DATA[current];
  if (!labels[item.id]) labels[item.id] = {};
  labels[item.id].note = document.getElementById('noteInput').value;
  localStorage.setItem('ksp_labels', JSON.stringify(labels));
}

// ── 统计 ──
const LABEL_COLORS = {
  correct: '#10b981', minor: '#f59e0b',
  miss_info: '#ef4444', over_clean: '#8b5cf6', skip: '#6b7280'
};
const LABEL_NAMES = {
  correct: '正确', minor: '轻微', miss_info: '漏信息', over_clean: '过度', skip: '跳过'
};

function updateStats() {
  const counts = {};
  for (const {label} of Object.values(labels)) {
    if (label) counts[label] = (counts[label] || 0) + 1;
  }
  const total = Object.values(counts).reduce((a,b) => a+b, 0);
  let html = `<span>已标注: ${total} / ${DATA.length}</span>`;
  for (const [k, cnt] of Object.entries(counts)) {
    const pct = Math.round(cnt / DATA.length * 100);
    html += `<span class="stats-item">
      <span class="stats-dot" style="background:${LABEL_COLORS[k]}"></span>
      ${LABEL_NAMES[k]}: ${cnt} (${pct}%)
    </span>`;
  }
  document.getElementById('statsBar').innerHTML = html;
}

// ── 导出 ──
function exportResults() {
  const out = DATA.map(item => ({
    id: item.id, region: item.region, title: item.title,
    reduction: item.reduction,
    label: (labels[item.id] || {}).label || '',
    note:  (labels[item.id] || {}).note  || '',
    original: item.original,
    cleaned:  item.cleaned,
  }));
  const labeled = out.filter(x => x.label);
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ksp_annotation_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  alert(`导出完成！已标注 ${labeled.length} / ${out.length} 条`);
}

// ── 键盘快捷键 ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const map = {'1':'correct','2':'minor','3':'miss_info','4':'over_clean','5':'skip'};
  if (map[e.key]) { setLabel(map[e.key]); return; }
  if (e.key === 'ArrowLeft')  navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});
</script>
</body>
</html>
