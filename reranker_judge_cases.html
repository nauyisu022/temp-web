// Group by type
const grouped = {};
allCases.forEach(c => {
  if (!grouped[c.group]) grouped[c.group] = [];
  grouped[c.group].push(c);
});

const ORDER = ['A','B','C','D','E','F'];

function verdictBadge(v, type) {
  if (!v) return '';
  const labels = { new_better:'新模型胜', old_better:'旧链路胜', tie:'持平' };
  const cls = v === 'new_better' ? 'badge-win' : v === 'old_better' ? 'badge-lose' : 'badge-tie';
  return `<span class="badge ${cls}">${type}: ${labels[v]}</span>`;
}

function scoreSpan(old_s, new_s) {
  const delta = new_s - old_s;
  const arrow = delta > 0 ? `▲+${delta}` : delta < 0 ? `▼${delta}` : '=';
  const color = delta > 0 ? '#16a34a' : delta < 0 ? '#dc2626' : '#64748b';
  return `<span style="color:${color};font-weight:700;font-size:13px;">  ${old_s}→${new_s} ${arrow}</span>`;
}

function termsHtml(terms, cls) {
  if (!terms || terms.length === 0)
    return '<span class="term-empty">（旧链路未召回任何词）</span>';
  return terms.map(t => `<span class="term">${t}</span>`).join('');
}

function caseHtml(c, idx) {
  const rWinner = c.r_verdict;
  const tWinner = c.t_verdict;
  const oldColCls = (tWinner === 'old_better') ? 'col old-col winner' : 'col old-col';
  const newColCls = (tWinner === 'new_better') ? 'col new-col winner' : 'col new-col';

  return `
  <div class="case-card">
    <div class="case-head">
      <span class="case-num">Case ${idx}</span>
      <span class="region-badge">${c.region}</span>
      <span class="product-name">${c.product_title}</span>
      <div class="score-badges">
        ${verdictBadge(c.r_verdict,'Retrieval')}
        ${verdictBadge(c.t_verdict,'Title')}
        ${verdictBadge(c.overall,'综合')}
      </div>
    </div>

    <div class="compare">
      <div class="${oldColCls}">
        <div class="col-header">
          <span class="col-label">旧链路 (P8 Chain)</span>
          <span class="col-score">Retrieval ${c.r_old}/5 · Title ${c.t_old}/5</span>
        </div>
        <div class="terms-section">
          <div class="terms-label">📌 搜索词</div>
          <div class="terms-wrap">${termsHtml(c.old_terms, 'old')}</div>
        </div>
        <div class="title-section">
          <div class="terms-label">📝 生成 Title</div>
          <div class="title-text">${c.old_title}</div>
        </div>
      </div>

      <div class="${newColCls}">
        <div class="col-header">
          <span class="col-label">新模型 (QC8503 v2)</span>
          <span class="col-score">Retrieval ${c.r_new}/5 · Title ${c.t_new}/5</span>
        </div>
        <div class="terms-section">
          <div class="terms-label">📌 搜索词</div>
          <div class="terms-wrap">${termsHtml(c.new_terms, 'new')}</div>
        </div>
        <div class="title-section">
          <div class="terms-label">📝 生成 Title</div>
          <div class="title-text">${c.new_title}</div>
        </div>
      </div>
    </div>

    <div class="reason-section">
      <div class="reason-label">🧑‍⚖️ Judge 评审意见</div>
      <div class="reason-text">${c.reason}</div>
      ${c.issues && c.issues.length > 0 ? `
        <div class="issues-wrap">
          ${c.issues.map(t => `<span class="issue-tag">${t}</span>`).join('')}
        </div>` : ''}
    </div>
  </div>`;
}

// Build tabs
const tabBar = document.getElementById('tabBar');
const mainContent = document.getElementById('mainContent');

ORDER.forEach((g, i) => {
  const meta = GROUP_META[g];
  const cases = grouped[g] || [];

  // Tab
  const tab = document.createElement('div');
  tab.className = 'tab' + (i === 0 ? ' active' : '');
  tab.textContent = `${meta.icon} ${meta.label} (${cases.length})`;
  tab.dataset.group = g;
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.group-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + g).classList.add('active');
  };
  tabBar.appendChild(tab);

  // Panel
  const panel = document.createElement('div');
  panel.id = 'panel-' + g;
  panel.className = 'group-panel' + (i === 0 ? ' active' : '');

  let panelHtml = `
    <div class="group-header" style="background:${meta.bg};border:1px solid ${meta.border};">
      <div class="icon">${meta.icon}</div>
      <div>
        <h2 style="color:${meta.color}">${meta.label}</h2>
        <p style="color:${meta.color};opacity:.8">${meta.desc}</p>
      </div>
    </div>`;

  cases.forEach((c, idx) => {
    panelHtml += caseHtml(c, idx + 1);
  });

  panel.innerHTML = panelHtml;
  mainContent.appendChild(panel);
});
</script>
