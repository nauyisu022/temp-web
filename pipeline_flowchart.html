<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Title Optimization v9 Pipeline</title>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Virgil', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif; background: #fff; }
  #canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const dpr = window.devicePixelRatio || 1;
const W = 1050, H = 1850;
const canvas = document.getElementById('canvas');
canvas.width = W * dpr; canvas.height = H * dpr;
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
const ctx = canvas.getContext('2d');
ctx.scale(dpr, dpr);
const rc = rough.canvas(canvas);
const S = 42;

const C = {
  input:   '#e8f0fe',
  select:  '#fff3e0',
  ksp:     '#fce4ec',
  info:    '#e8f0fe',
  search:  '#e8f5e9',
  sim:     '#e8f5e9',
  sort:    '#f3e5f5',
  llm:     '#e3f2fd',
  pattern: '#fff8e1',
  ek:      '#fff3e0',
  filter:  '#fce4ec',
  output:  '#e8f5e9',
  white:   '#fff',
  dataBg:  '#f5f5f5',
};

function rect(x, y, w, h, fill, opts) {
  rc.rectangle(x, y, w, h, { roughness: 1, strokeWidth: 1.5, fill, fillStyle: 'solid', seed: S, ...opts });
}

function text(str, x, y, { font = '14px', bold = false, color = '#222', align = 'center' } = {}) {
  ctx.fillStyle = color;
  ctx.font = (bold ? 'bold ' : '') + font + ' "Virgil", "Segoe Print", "Comic Sans MS", cursive';
  ctx.textAlign = align;
  ctx.fillText(str, x, y);
}

function arrow(x1, y1, x2, y2, opts = {}) {
  const o = { roughness: 0.7, strokeWidth: 1.5, seed: S, ...opts };
  rc.line(x1, y1, x2, y2, o);
  const a = Math.atan2(y2 - y1, x2 - x1), sz = 9;
  rc.line(x2, y2, x2 - sz * Math.cos(a - 0.4), y2 - sz * Math.sin(a - 0.4), o);
  rc.line(x2, y2, x2 - sz * Math.cos(a + 0.4), y2 - sz * Math.sin(a + 0.4), o);
}

// Format annotation: small italic text next to arrow
function fmt(str, x, y) {
  text(str, x, y, { font: '9px', color: '#999', align: 'left' });
}

const mx = 350;
const rx = 810;

// ── Title ──
text('Title Optimization v9', W / 2, 38, { font: '26px', bold: true });
text('Shopee Google Ads Title Optimization Pipeline', W / 2, 62, { font: '13px', color: '#888' });

// ══════════════════════════════════════════════════════════════
// Row 0: Inputs
// ══════════════════════════════════════════════════════════════
const y0 = 95;
rect(220, y0, 180, 42, C.input);
text('item Catalog', 310, y0 + 26, { font: '13px', bold: true });

rect(650, y0, 220, 42, C.input);
text('item with performance', 760, y0 + 26, { font: '13px', bold: true });

arrow(310, y0 + 42, 310, y0 + 70);
arrow(420, y0 + 15, 650, y0 + 15);

// ══════════════════════════════════════════════════════════════
// Row 1: Product Selection
// ══════════════════════════════════════════════════════════════
const y1 = 170;
rect(mx - 140, y1, 280, 55, C.select);
text('Product Selection', mx, y1 + 22, { font: '15px', bold: true });
text('Choosing Items with CPO Improvement Space', mx, y1 + 42, { font: '11px', color: '#666' });

arrow(mx, y1 + 55, mx, y1 + 85);

// ══════════════════════════════════════════════════════════════
// Row 2: KSP Extraction (v9: 4-step CoT)
// ══════════════════════════════════════════════════════════════
const y2 = 265;
const kw = 380, kh = 290;
rect(mx - kw/2, y2, kw, kh, C.ksp);
text('Product KSP Extraction', mx, y2 + 22, { font: '15px', bold: true });
text('4-Round Multi-turn CoT', mx, y2 + 40, { font: '11px', bold: true, color: '#c62828' });

// Step boxes inside KSP
const stepX = mx - kw/2 + 20;
const stepW = kw - 40;
const stepH = 32;
const stepGap = 12;
let sy = y2 + 52;

rect(stepX, sy, stepW, stepH, C.white);
text('Step 1: User Profile', mx - 40, sy + 14, { font: '11px', bold: true });
text('— target user · search intent · select schema', mx + 60, sy + 27, { font: '9px', color: '#666' });

sy += stepH + stepGap;
arrow(mx, sy - stepGap, mx, sy);

rect(stepX, sy, stepW, stepH, C.white);
text('Step 2: Keywords Extraction', mx - 20, sy + 14, { font: '11px', bold: true });
text('— extract + expand search keywords by attribute', mx + 55, sy + 27, { font: '9px', color: '#666' });

sy += stepH + stepGap;
arrow(mx, sy - stepGap, mx, sy);

rect(stepX, sy, stepW, stepH, C.white);
text('Step 3: Candidates Generation', mx - 10, sy + 14, { font: '11px', bold: true });
text('— brand → USP → long_tail (n=5 candidates)', mx + 55, sy + 27, { font: '9px', color: '#666' });

sy += stepH + stepGap;
arrow(mx, sy - stepGap, mx, sy);

rect(stepX, sy, stepW, stepH, C.white);
text('Step 4: Evaluation & Selection', mx - 10, sy + 14, { font: '11px', bold: true });
text('— 4-dim scoring · pick best of 5 candidates', mx + 55, sy + 27, { font: '9px', color: '#666' });

// Output fields
sy += stepH + 12;
const outLabels = ['Brand', 'Product Type', 'USP', 'Long-tail KW'];
const olW = 75, olH = 24, olGap = 8;
const olTotalW = outLabels.length * olW + (outLabels.length - 1) * olGap;
let olX = mx - olTotalW / 2;
for (const lb of outLabels) {
  rect(olX, sy, olW, olH, C.white);
  text(lb, olX + olW / 2, sy + 16, { font: '9px' });
  olX += olW + olGap;
}

// Format annotation: KSP output
fmt('.parquet', mx + kw/2 + 8, y2 + kh - 10);

// ── Right: Cluster by ProductType ──
const cy2 = y2 + 80;
rect(rx - 110, cy2, 220, 45, C.pattern);
text('Cluster by', rx, cy2 + 18, { font: '13px', bold: true });
rect(rx - 60, cy2 + 22, 120, 20, C.white);
text('Product Type', rx, cy2 + 36, { font: '10px' });

arrow(mx + kw / 2, y2 + 90, rx - 110, cy2 + 22);

// ══════════════════════════════════════════════════════════════
// Row 3: Product Information + Search Terms
// ══════════════════════════════════════════════════════════════
const y3 = y2 + kh + 45;

// Product Information — FIX: both KSP arrows point here
rect(mx - 140, y3, 280, 75, C.info);
text('Product Information', mx, y3 + 20, { font: '13px', bold: true });
rect(mx - 130, y3 + 30, 120, 35, C.white);
text('Original Title', mx - 70, y3 + 44, { font: '9px' });
text('+ Description', mx - 70, y3 + 58, { font: '9px' });
rect(mx + 10, y3 + 30, 120, 35, C.white);
text('Original Title', mx + 70, y3 + 44, { font: '9px' });
text('+ KSP', mx + 70, y3 + 58, { font: '9px' });

// FIX(A): KSP only goes to Product Information, NOT to Search Terms
arrow(mx, y2 + kh, mx, y3);

// Search Terms — separate, comes from "item with performance"
rect(mx + 200, y3 + 5, 170, 55, C.search);
text('Search Terms', mx + 285, y3 + 27, { font: '13px', bold: true });
text('(with Performance)', mx + 285, y3 + 45, { font: '11px', color: '#666' });

// FIX(A): item with performance → Search Terms (clean L-shape on the right)
arrow(760, y0 + 42, 760, y3 - 20);
rc.line(760, y3 - 20, mx + 285, y3 - 20, { roughness: 0.7, strokeWidth: 1.5, seed: S });
arrow(mx + 285, y3 - 20, mx + 285, y3 + 5);

// ══════════════════════════════════════════════════════════════
// Row 4: Search Simulator
// ══════════════════════════════════════════════════════════════
const y4 = y3 + 120;
const ssW = 430, ssH = 280;
rect(mx - ssW/2, y4, ssW, ssH, C.sim);
text('Search Simulator', mx, y4 + 24, { font: '16px', bold: true });

const wsY = y4 + 38;
rect(mx - 170, wsY, 130, 28, C.white);
text('Word Segmentation', mx - 105, wsY + 18, { font: '10px' });
rect(mx + 40, wsY, 130, 28, C.white);
text('Word Segmentation', mx + 105, wsY + 18, { font: '10px' });

// Product Info → left Word Seg, Search Terms → right Word Seg
arrow(mx - 70, y3 + 75, mx - 105, y4);
arrow(mx + 285, y3 + 60, mx + 105, y4);

const iiY = y4 + 80;
rect(mx - 160, iiY, 320, 55, C.white);
text('Inverted Index', mx, iiY + 16, { font: '12px', bold: true });
rect(mx - 140, iiY + 22, 130, 26, C.input);
text('Text Index (BM25s)', mx - 75, iiY + 38, { font: '10px' });
rect(mx + 10, iiY + 22, 150, 26, C.input);
text('Semantic Index (Qwen3 Emb)', mx + 85, iiY + 38, { font: '9px' });

arrow(mx - 105, wsY + 28, mx - 75, iiY);
arrow(mx + 105, wsY + 28, mx + 85, iiY);

const srY = iiY + 68;
rect(mx - 85, srY, 170, 30, C.white);
text('Similarity Recall', mx, srY + 19, { font: '12px' });
arrow(mx, iiY + 55, mx, srY);

// Format annotation
fmt('memmap (N×100)', mx + ssW/2 + 8, srY + 10);

const rrY = srY + 45;
rect(mx - 100, rrY, 200, 35, C.white);
text('Relevance Re-ranking', mx, rrY + 15, { font: '12px' });
text('(Qwen3 Reranker · Fine-tuned)', mx, rrY + 29, { font: '10px', color: '#c62828' });
arrow(mx, srY + 30, mx, rrY);

// Format annotation
fmt('memmap idx+sco', mx + ssW/2 + 8, rrY + 15);

// ══════════════════════════════════════════════════════════════
// Row 5: Sorting
// ══════════════════════════════════════════════════════════════
const y5 = y4 + ssH + 35;
rect(mx - 145, y5, 290, 40, C.sort);
text('Sorting (Conversion score × Relevance score)', mx, y5 + 25, { font: '12px' });

arrow(mx, y4 + ssH, mx, y5);

// FIX(F): data annotation in a light dashed box
const y5b = y5 + 52;
const dataBoxW = 290, dataBoxH = 48;
rect(mx - dataBoxW/2, y5b - 8, dataBoxW, dataBoxH, C.dataBg, { strokeLineDash: [4, 3], stroke: '#bbb', strokeWidth: 1 });
text('Original Title + KSP +', mx - 30, y5b + 6, { font: '11px', color: '#555', align: 'left' });
text('High Relevance Good search terms', mx + 5, y5b + 20, { font: '11px', color: '#555', align: 'left' });
text('High Relevance Bad search terms', mx + 5, y5b + 34, { font: '11px', color: '#555', align: 'left' });

arrow(mx, y5 + 40, mx, y5b - 8);

// Format annotation
fmt('.pkl', mx + dataBoxW/2 + 8, y5b + 15);

// ══════════════════════════════════════════════════════════════
// Row 6: LLM Title Generator + Right branch at same height
// ══════════════════════════════════════════════════════════════
const y6 = y5b + dataBoxH + 20;
const lgW = 380, lgH = 170;
rect(mx - lgW/2, y6, lgW, lgH, C.llm);
text('LLM Title Generator', mx, y6 + 22, { font: '16px', bold: true });

// FIX(C): Call 1 expanded with facts fields
rect(mx - lgW/2 + 15, y6 + 34, lgW - 30, 48, C.white);
text('Call 1: Extract Facts + Policy', mx, y6 + 50, { font: '11px', bold: true });
text('brand · product_type · specs · core_usp · signals', mx, y6 + 66, { font: '9px', color: '#666' });
text('→ select policy (max_len, structure rules)', mx, y6 + 78, { font: '9px', color: '#666' });

text('+', mx, y6 + 95, { font: '16px', bold: true, color: '#1565c0' });

// Call 2 expanded
rect(mx - lgW/2 + 15, y6 + 104, lgW - 30, 38, C.white);
text('Call 2: Generate Optimized Title', mx, y6 + 118, { font: '11px', bold: true });
text('facts + policy + search terms + EK → title', mx, y6 + 133, { font: '9px', color: '#666' });

text('GPT-5-mini · async · concurrency=200', mx, y6 + 160, { font: '10px', color: '#888' });

arrow(mx, y5b + dataBoxH, mx, y6);

// Format annotation
fmt('.db (SQLite)', mx + lgW/2 + 8, y6 + 90);

// ── Right: Title Pattern Generation (FIX(E): marked offline) ──
const tpY = y6 - 30;
rect(rx - 130, tpY, 260, 105, C.pattern);
text('Title Pattern Generation', rx, tpY + 20, { font: '14px', bold: true });
text('offline', rx + 95, tpY + 20, { font: '9px', bold: true, color: '#e65100' });
rect(rx - 115, tpY + 32, 230, 22, C.white);
text('Mining Good / Bad Title Examples', rx, tpY + 47, { font: '10px' });
rect(rx - 115, tpY + 58, 230, 22, C.white);
text('Pattern Generation (LLM & CoT)', rx, tpY + 73, { font: '10px' });
text('→ SQLite DB', rx, tpY + 95, { font: '9px', color: '#999' });

arrow(rx, cy2 + 45, rx, tpY);

// ── Right: Expert Knowledge (FIX(G): aligned with LLM, horizontal arrow) ──
const ekY = tpY + 125;
rect(rx - 120, ekY, 240, 95, C.ek);
text('Expert Knowledge', rx, ekY + 20, { font: '13px', bold: true });
text('by cluster priority:', rx, ekY + 38, { font: '11px', color: '#555' });
text('1. Product Type', rx, ekY + 55, { font: '11px', color: '#555' });
text('2. L3 Category', rx, ekY + 70, { font: '11px', color: '#555' });
text('3. L2 Category', rx, ekY + 85, { font: '11px', color: '#555' });

arrow(rx, tpY + 105, rx, ekY);

// FIX(G): clean horizontal arrow from EK to LLM (both at similar height now)
const ekArrowY = ekY + 48;
arrow(rx - 120, ekArrowY, mx + lgW / 2, ekArrowY);

// ══════════════════════════════════════════════════════════════
// Row 7: Blacklist Filter (FIX: add Google Policy info)
// ══════════════════════════════════════════════════════════════
const y7 = y6 + lgH + 40;
rect(mx - 145, y7, 290, 60, C.filter);
text('Blacklist Filter', mx, y7 + 20, { font: '14px', bold: true });
text('flashtext (Aho-Corasick) · CJK cleanup', mx, y7 + 38, { font: '10px', color: '#666' });
text('Google GMC Policy Compliance', mx, y7 + 52, { font: '10px', color: '#666' });

arrow(mx, y6 + lgH, mx, y7);

// ══════════════════════════════════════════════════════════════
// Row 8: Output
// ══════════════════════════════════════════════════════════════
const y8 = y7 + 85;
rect(mx - 95, y8, 190, 40, C.output, { stroke: '#2e7d32', strokeWidth: 2 });
text('Enhanced Title', mx, y8 + 17, { font: '14px', bold: true, color: '#2e7d32' });
text('→ Hive (Parquet)', mx, y8 + 33, { font: '11px', color: '#555' });

arrow(mx, y7 + 60, mx, y8);
text('BR · ID · MY · PH · SG · TH · TW · VN', mx, y8 + 58, { font: '11px', color: '#aaa' });

// ══════════════════════════════════════════════════════════════
// v9 change highlights
// ══════════════════════════════════════════════════════════════
const redDash = { roughness: 0.5, strokeWidth: 1.8, strokeLineDash: [5, 3], stroke: '#c62828', seed: S };

rc.rectangle(mx - kw/2 - 6, y2 - 6, kw + 12, kh + 12, redDash);
text('v9 changed', mx + kw/2 + 20, y2 + 15, { font: '11px', bold: true, color: '#c62828', align: 'left' });

rc.rectangle(mx - lgW/2 - 6, y6 - 6, lgW + 12, lgH + 12, redDash);
text('v9 changed', mx + lgW/2 + 20, y6 + 15, { font: '11px', bold: true, color: '#c62828', align: 'left' });

</script>
</body>
</html>
