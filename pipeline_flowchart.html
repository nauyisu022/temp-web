<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Title Optimization v9 Pipeline</title>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe Print', 'Comic Sans MS', 'Virgil', cursive, sans-serif;
    background: #fff;
    padding: 20px;
  }
  #canvas {
    display: block;
    margin: 0 auto;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const dpr = window.devicePixelRatio || 1;
const W = 1100, H = 1520;
const canvas = document.getElementById('canvas');
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
const ctx = canvas.getContext('2d');
ctx.scale(dpr, dpr);

const rc = rough.canvas(canvas);
const seed = 42;
const boxOpt = { roughness: 1.2, strokeWidth: 1.5, seed };
const arrowOpt = { roughness: 0.8, strokeWidth: 1.5, seed };
const dashOpt = { roughness: 0.6, strokeWidth: 1, strokeLineDash: [6, 4], stroke: '#888', seed };

// Colors (muted, excalidraw-like)
const C = {
  input: '#e8f0fe',
  p0: '#fff3e0',
  p1: '#e8f5e9',
  p2: '#fce4ec',
  p3: '#f3e5f5',
  p4: '#e3f2fd',
  p5: '#fff8e1',
  output: '#e8f5e9',
  border: '#333',
};

function box(x, y, w, h, fill, label, sub, tag) {
  rc.rectangle(x, y, w, h, { ...boxOpt, fill, fillStyle: 'solid', fillWeight: 0.5, stroke: C.border });
  ctx.fillStyle = '#222';
  ctx.font = 'bold 16px "Segoe Print", "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + 24);
  if (sub) {
    ctx.font = '12px "Segoe Print", "Comic Sans MS", cursive';
    ctx.fillStyle = '#555';
    const lines = sub.split('\n');
    lines.forEach((line, i) => {
      ctx.fillText(line, x + w / 2, y + 44 + i * 17);
    });
  }
  if (tag) {
    ctx.font = '11px "Segoe Print", "Comic Sans MS", cursive';
    ctx.fillStyle = '#888';
    ctx.fillText(tag, x + w / 2, y + h - 8);
  }
}

function smallBox(x, y, w, h, fill, label, sub) {
  rc.rectangle(x, y, w, h, { ...boxOpt, fill, fillStyle: 'solid', fillWeight: 0.5, stroke: C.border });
  ctx.fillStyle = '#222';
  ctx.font = 'bold 13px "Segoe Print", "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + 20);
  if (sub) {
    ctx.font = '11px "Segoe Print", "Comic Sans MS", cursive';
    ctx.fillStyle = '#666';
    const lines = sub.split('\n');
    lines.forEach((line, i) => {
      ctx.fillText(line, x + w / 2, y + 36 + i * 15);
    });
  }
}

function arrow(x1, y1, x2, y2) {
  rc.line(x1, y1, x2, y2, arrowOpt);
  // arrowhead
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const sz = 10;
  rc.line(x2, y2, x2 - sz * Math.cos(angle - 0.4), y2 - sz * Math.sin(angle - 0.4), arrowOpt);
  rc.line(x2, y2, x2 - sz * Math.cos(angle + 0.4), y2 - sz * Math.sin(angle + 0.4), arrowOpt);
}

function dashArrow(x1, y1, x2, y2) {
  rc.line(x1, y1, x2, y2, dashOpt);
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const sz = 8;
  rc.line(x2, y2, x2 - sz * Math.cos(angle - 0.4), y2 - sz * Math.sin(angle - 0.4), dashOpt);
  rc.line(x2, y2, x2 - sz * Math.cos(angle + 0.4), y2 - sz * Math.sin(angle + 0.4), dashOpt);
}

function note(x, y, text) {
  ctx.font = '11px "Segoe Print", "Comic Sans MS", cursive';
  ctx.fillStyle = '#999';
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y);
}

// ====== Layout ======
const cx = W / 2;  // center x
const bw = 280;    // box width
const bh = 80;     // box height
const gap = 40;    // vertical gap

// --- Title ---
ctx.fillStyle = '#222';
ctx.font = 'bold 22px "Segoe Print", "Comic Sans MS", cursive';
ctx.textAlign = 'center';
ctx.fillText('Title Optimization v9 Pipeline', cx, 35);
ctx.font = '13px "Segoe Print", "Comic Sans MS", cursive';
ctx.fillStyle = '#888';
ctx.fillText('Shopee Google Ads — 8 regions · 6 stages · distributed', cx, 58);

// --- Input data sources ---
const iy = 90;
smallBox(80, iy, 160, 55, C.input, '🛍️ 商品数据', 'title + description');
smallBox(280, iy, 160, 55, C.input, '🔍 搜索词', 'impressions/clicks/orders');
smallBox(660, iy, 160, 55, C.input, '🧠 专家知识', 'VC / L3 / L2 层级');
smallBox(860, iy, 160, 55, C.input, '🚫 黑名单', '各地区 Google 违规词');

// --- P0 ---
const p0y = 200;
box(cx - bw/2, p0y, bw, bh, C.p0,
  'P0  KSP 卖点蒸馏',
  'vLLM + LoRA → 结构化卖点 JSON\n品牌 / 规格 / USP 提取',
  'Qwen2.5-7B · batch=512');

// arrows from inputs to P0
arrow(160, iy + 55, cx - 40, p0y);
dashArrow(360, iy + 55, cx + 40, p0y);

// --- P1 split ---
const p1y = p0y + bh + gap + 10;
const p1w = 220;
const p1h = 85;
const p1gap = 80;
// P1a BM25
smallBox(cx - p1w - p1gap/2, p1y, p1w, p1h, C.p1,
  'P1a  BM25 召回',
  'bm25s 建索引 + numba 加速\n倒排反转 → doc → top100 queries');
// P1b Embedding
smallBox(cx + p1gap/2, p1y, p1w, p1h, C.p1,
  'P1b  Embedding 召回',
  'Qwen3-Embedding-4B\nFAISS ANN → doc_topk=100');

// arrows P0 → P1a, P1b
arrow(cx - 40, p0y + bh, cx - p1w/2 - p1gap/2, p1y);
arrow(cx + 40, p0y + bh, cx + p1gap/2 + p1w/2, p1y);

// arrows inputs → P1
arrow(360, iy + 55, cx - p1gap/2 - p1w + 30, p1y);
arrow(360, iy + 55, cx + p1gap/2 + p1w - 30, p1y);

// parallel note
note(cx, p1y + p1h/2, '⚡ 可并行');

// --- P2 ---
const p2y = p1y + p1h + gap;
box(cx - bw/2, p2y, bw, bh, C.p2,
  'P2  Rerank 精排',
  '合并两路 → Qwen3-Reranker 打分\n阈值 ≥ 0.5 · 每商品 max 100 词',
  'Qwen3-Reranker-0.6B · LoRA · vLLM');

// arrows P1 → P2
arrow(cx - p1gap/2 - p1w/2, p1y + p1h, cx - 40, p2y);
arrow(cx + p1gap/2 + p1w/2, p1y + p1h, cx + 40, p2y);

// --- P3 ---
const p3y = p2y + bh + gap;
box(cx - bw/2, p3y, bw, bh, C.p3,
  'P3  上下文构建',
  '汇聚: 精排词 + KSP + 专家知识\ngood/bad keywords · 垃圾词过滤',
  'imp×0.2 + click×0.3 + order×0.5');

arrow(cx, p2y + bh, cx, p3y);

// P0 output → P3 (side arrow)
rc.line(cx + bw/2, p0y + bh/2, cx + bw/2 + 50, p0y + bh/2, dashOpt);
rc.line(cx + bw/2 + 50, p0y + bh/2, cx + bw/2 + 50, p3y + bh/2, dashOpt);
dashArrow(cx + bw/2 + 50, p3y + bh/2, cx + bw/2, p3y + bh/2);
note(cx + bw/2 + 80, (p0y + p3y) / 2 + 40, 'KSP →');

// expert knowledge → P3
dashArrow(740, iy + 55, cx + bw/2 - 20, p3y);

// --- P4 ---
const p4y = p3y + bh + gap;
const p4h = 100;
box(cx - bw/2, p4y, bw, p4h, C.p4,
  'P4  LLM 标题生成',
  'Call 1: 提取 Facts + Policy\nCall 2: 生成优化标题\n图算法搜索词选择 · TitleGuard 后处理',
  'GPT-5-mini · async · concurrency=200');

arrow(cx, p3y + bh, cx, p4y);

// blacklist → P4
dashArrow(940, iy + 55, cx + bw/2 - 20, p4y);

// --- P5 ---
const p5y = p4y + p4h + gap;
box(cx - bw/2, p5y, bw, bh, C.p5,
  'P5  过滤 & 输出',
  'flashtext 黑名单移除 · CJK 清理\nParquet → Hive · 生成 Presto SQL',
  'Aho-Corasick · PyArrowIO');

arrow(cx, p4y + p4h, cx, p5y);

// blacklist → P5
dashArrow(940, iy + 55, cx + bw/2 - 20, p5y + 10);

// --- Output ---
const oy = p5y + bh + gap - 10;
const ow = 320;
rc.rectangle(cx - ow/2, oy, ow, 50, { ...boxOpt, fill: C.output, fillStyle: 'solid', stroke: '#2e7d32' });
ctx.fillStyle = '#2e7d32';
ctx.font = 'bold 14px "Segoe Print", "Comic Sans MS", cursive';
ctx.textAlign = 'center';
ctx.fillText('📤  Hive 表: opa_algo.google_optimized_title_*', cx, oy + 22);
ctx.font = '11px "Segoe Print", "Comic Sans MS", cursive';
ctx.fillStyle = '#666';
ctx.fillText('BR · ID · MY · PH · SG · TH · TW · VN', cx, oy + 40);

arrow(cx, p5y + bh, cx, oy);

// --- Output format labels ---
const ly = p0y + bh + 15;
note(cx - p1w - p1gap/2 + p1w/2, ly, '↓ memmap');
note(cx + p1gap/2 + p1w/2, ly, '↓ memmap');
note(cx + 160, p2y + bh + 20, '→ memmap idx+sco');
note(cx + 160, p3y + bh + 20, '→ .pkl');
note(cx + 160, p4y + p4h + 20, '→ .db (SQLite)');
note(cx + 160, p5y + bh + 20, '→ Parquet');

</script>
</body>
</html>
