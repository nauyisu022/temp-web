<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索词树图</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: #fffaf2;
      --ink: #1f262b;
      --muted: #64707a;
      --line: rgba(31, 38, 43, 0.12);
      --accent: #9d4b32;
      --accent-soft: rgba(157, 75, 50, 0.12);
      --shadow: 0 18px 40px rgba(76, 57, 30, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(157, 75, 50, 0.12), transparent 26rem),
        linear-gradient(180deg, #f8f4ed 0%, var(--bg) 100%);
    }
    .wrap {
      width: min(1080px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }
    .hero, .section {
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255, 250, 242, 0.94);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .eyebrow {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 14px 0 8px;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.05;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 15px;
    }
    .section h2 {
      margin: 0 0 14px;
      font-size: 22px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(157, 75, 50, 0.3);
      box-shadow: 0 16px 30px rgba(76, 57, 30, 0.08);
    }
    .card .tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(31, 38, 43, 0.06);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.3;
    }
    .card p {
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <span class="eyebrow">Search Tree</span>
      <h1>搜索词树图</h1>
      <p>这里收录按当前建树规则导出的局部树图页面，适合快速查看某个根词下面的结构和分叉。</p>
    </section>
    <section class="section">
      <h2>树图列表</h2>
      <div class="grid">

        <a class="card" href="tw-tree-5c904cd9cf.html">
          <div class="tag">TW</div>
          <h3>收納</h3>
          <p>34 节点 · 33 连线 · 深度 2 · 每层最多展示 6 个子词</p>
        </a>

        <a class="card" href="tw-tree-db0527be17.html">
          <div class="tag">TW</div>
          <h3>行動電源</h3>
          <p>32 节点 · 31 连线 · 深度 2 · 每层最多展示 6 个子词</p>
        </a>

        <a class="card" href="tw-tree-b06628fd27.html">
          <div class="tag">TW</div>
          <h3>行動電源</h3>
          <p>32 节点 · 32 连线 · 深度 2 · 每层最多展示 6 个子词 · 多父不限制</p>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
