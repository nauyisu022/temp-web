<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TW search-term universe</title>
  <script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>
  <style>
    :root {
      --bg: #fafaf6;
      --ink: #1c1c1a;
      --muted: #8a8a85;
      --line: rgba(28, 28, 26, 0.10);
      --accent: #9d4b32;
      --serif: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "Source Han Serif SC", serif;
      --mono: "SFMono-Regular", "JetBrains Mono", "Cascadia Code", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: var(--serif);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 32px 48px 16px;
      border-bottom: 1px solid var(--line);
    }
    header .crumb {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    header .crumb a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }
    header h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(28px, 3.4vw, 44px);
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    header .sub {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    main {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    #stage {
      position: absolute;
      inset: 0;
      background: var(--bg);
    }
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 600ms ease;
    }
    #loader.done { opacity: 0; }
    .panel {
      position: absolute;
      bottom: 24px;
      left: 24px;
      max-width: 360px;
      background: rgba(250, 250, 246, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--line);
      padding: 18px 20px;
      font-size: 14px;
      line-height: 1.55;
    }
    .panel .title {
      font-family: var(--serif);
      font-size: 20px;
      letter-spacing: -0.005em;
      word-break: break-all;
    }
    .panel .kv {
      margin-top: 10px;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 14px;
      row-gap: 4px;
      font-family: var(--mono);
      font-size: 12px;
    }
    .panel .kv dt { color: var(--muted); letter-spacing: 0.03em; }
    .panel .kv dd { margin: 0; color: var(--ink); }
    .panel .hint {
      margin-top: 12px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .legend {
      position: absolute;
      top: 24px;
      right: 24px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-align: right;
      line-height: 1.7;
      background: rgba(250, 250, 246, 0.7);
      padding: 10px 14px;
      border: 1px solid var(--line);
    }
    .legend .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 6px;
      vertical-align: middle;
      border-radius: 50%;
    }
    footer {
      padding: 12px 48px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--muted);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 24px;
    }
    footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }
    @media (max-width: 720px) {
      header { padding: 24px 20px 12px; }
      footer { padding: 10px 20px; flex-direction: column; gap: 6px; }
      .panel { left: 12px; right: 12px; max-width: none; bottom: 12px; }
      .legend { top: 12px; right: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="crumb"><a href="../index.html">../</a></div>
    <h1>TW search-term universe</h1>
    <div class="sub" id="meta">loading…</div>
  </header>
  <main>
    <div id="stage"></div>
    <div id="loader"><span>loading graph</span><span id="loader-detail">fetching data…</span></div>
    <div class="legend">
      <div>node size · log impressions</div>
      <div>ancestors <span class="dot" style="background:#9d4b32"></span></div>
      <div>descendants <span class="dot" style="background:#3b6aa3"></span></div>
    </div>
    <div class="panel" id="panel" style="display:none">
      <div class="title" id="panel-title"></div>
      <dl class="kv" id="panel-kv"></dl>
      <div class="hint">click empty area to clear</div>
    </div>
  </main>
  <footer>
    <span>layout · igraph drl · server-side</span>
    <span>render · sigma.js webgl</span>
  </footer>
  <script>
    const DATA_HREF = "graph.json";
    const fmt = new Intl.NumberFormat('en-US');

    const COLOR_DEFAULT = '#1c1c1a';
    const COLOR_DEFAULT_ALPHA = 0.18;
    const COLOR_DIM = 'rgba(28,28,26,0.04)';
    const COLOR_EDGE = 'rgba(28,28,26,0.05)';
    const COLOR_EDGE_DIM = 'rgba(28,28,26,0.015)';
    const COLOR_ANCESTOR = '#9d4b32';
    const COLOR_DESCENDANT = '#3b6aa3';
    const COLOR_FOCUS = '#1c1c1a';

    function alphaHex(hex, alpha) {
      const n = Math.round(alpha * 255).toString(16).padStart(2, '0');
      return hex + n;
    }

    async function boot() {
      const loaderDetail = document.getElementById('loader-detail');
      loaderDetail.textContent = 'fetching ' + DATA_HREF;
      const response = await fetch(DATA_HREF);
      const data = await response.json();

      loaderDetail.textContent = 'building graph (' + fmt.format(data.meta.total_nodes) + ' nodes)';
      await new Promise((r) => setTimeout(r, 16));

      const graph = new graphology.Graph({ type: 'directed', multi: false, allowSelfLoops: false });

      const labels = data.labels;
      const impressions = data.impressions;
      const xs = data.x;
      const ys = data.y;
      const children = data.children;
      const parents = data.parents;

      const sizes = new Float32Array(labels.length);
      let maxLog = 0;
      for (let i = 0; i < impressions.length; i++) {
        const v = Math.log10(Math.max(impressions[i], 1) + 1);
        sizes[i] = v;
        if (v > maxLog) maxLog = v;
      }
      const sizeScale = (v) => 0.6 + (v / Math.max(maxLog, 0.01)) * 6.0;

      for (let i = 0; i < labels.length; i++) {
        graph.addNode(String(i), {
          label: labels[i],
          x: xs[i],
          y: ys[i],
          size: sizeScale(sizes[i]),
          color: alphaHex(COLOR_DEFAULT, COLOR_DEFAULT_ALPHA),
          _baseColor: alphaHex(COLOR_DEFAULT, COLOR_DEFAULT_ALPHA),
          _baseSize: sizeScale(sizes[i]),
        });
      }

      loaderDetail.textContent = 'wiring edges (' + fmt.format(data.meta.total_edges) + ')';
      await new Promise((r) => setTimeout(r, 16));

      let edgeId = 0;
      for (let parentId = 0; parentId < children.length; parentId++) {
        const list = children[parentId];
        for (let k = 0; k < list.length; k++) {
          graph.addEdgeWithKey('e' + (edgeId++), String(parentId), String(list[k]), {
            color: COLOR_EDGE,
            size: 0.4,
          });
        }
      }

      loaderDetail.textContent = 'mounting renderer';
      await new Promise((r) => setTimeout(r, 16));

      const stage = document.getElementById('stage');
      const renderer = new Sigma(graph, stage, {
        renderEdgeLabels: false,
        defaultEdgeColor: COLOR_EDGE,
        defaultNodeColor: alphaHex(COLOR_DEFAULT, COLOR_DEFAULT_ALPHA),
        labelFont: 'Iowan Old Style, serif',
        labelSize: 12,
        labelWeight: '400',
        labelColor: { color: '#1c1c1a' },
        labelDensity: 0.12,
        labelGridCellSize: 80,
        labelRenderedSizeThreshold: 4.5,
        zIndex: false,
        minCameraRatio: 0.02,
        maxCameraRatio: 8,
      });

      document.getElementById('meta').textContent =
        fmt.format(data.meta.total_nodes) + ' nodes · ' +
        fmt.format(data.meta.total_edges) + ' edges · ' +
        'a3 + drl';

      document.getElementById('loader').classList.add('done');
      setTimeout(() => {
        const el = document.getElementById('loader');
        if (el) el.style.display = 'none';
      }, 700);

      const panel = document.getElementById('panel');
      const panelTitle = document.getElementById('panel-title');
      const panelKv = document.getElementById('panel-kv');

      function bfs(startId, neighborsArr) {
        const visited = new Set([startId]);
        const queue = [startId];
        while (queue.length) {
          const cur = queue.shift();
          const nbrs = neighborsArr[Number(cur)];
          for (let i = 0; i < nbrs.length; i++) {
            const next = String(nbrs[i]);
            if (!visited.has(next)) {
              visited.add(next);
              queue.push(next);
            }
          }
        }
        return visited;
      }

      let highlighted = null;

      function clearHighlight() {
        if (!highlighted) return;
        graph.forEachNode((nodeId, attrs) => {
          graph.mergeNodeAttributes(nodeId, {
            color: attrs._baseColor,
            size: attrs._baseSize,
            zIndex: 0,
          });
        });
        graph.forEachEdge((edgeId) => {
          graph.mergeEdgeAttributes(edgeId, { color: COLOR_EDGE, size: 0.4 });
        });
        highlighted = null;
        panel.style.display = 'none';
      }

      function highlight(nodeId) {
        const ancestors = bfs(nodeId, parents);
        const descendants = bfs(nodeId, children);

        graph.forEachNode((id, attrs) => {
          let color = COLOR_DIM;
          let size = attrs._baseSize * 0.5;
          let zIndex = 0;
          if (id === nodeId) {
            color = COLOR_FOCUS;
            size = attrs._baseSize * 1.6;
            zIndex = 3;
          } else if (ancestors.has(id)) {
            color = COLOR_ANCESTOR;
            size = attrs._baseSize * 1.1;
            zIndex = 2;
          } else if (descendants.has(id)) {
            color = COLOR_DESCENDANT;
            size = attrs._baseSize * 1.0;
            zIndex = 2;
          }
          graph.mergeNodeAttributes(id, { color, size, zIndex });
        });

        graph.forEachEdge((edgeId, attrs, source, target) => {
          const inAnc = ancestors.has(source) && ancestors.has(target);
          const inDesc = descendants.has(source) && descendants.has(target);
          const incident = source === nodeId || target === nodeId;
          if (inAnc || (incident && ancestors.has(source))) {
            graph.mergeEdgeAttributes(edgeId, { color: COLOR_ANCESTOR + 'aa', size: 0.8 });
          } else if (inDesc || (incident && descendants.has(target))) {
            graph.mergeEdgeAttributes(edgeId, { color: COLOR_DESCENDANT + 'aa', size: 0.8 });
          } else {
            graph.mergeEdgeAttributes(edgeId, { color: COLOR_EDGE_DIM, size: 0.3 });
          }
        });

        highlighted = nodeId;
        const idx = Number(nodeId);
        panelTitle.textContent = labels[idx];
        const parentLabels = parents[idx].slice(0, 6).map((i) => labels[i]).join(' · ') || '—';
        const childLabels = children[idx].slice(0, 6).map((i) => labels[i]).join(' · ') || '—';
        panelKv.innerHTML = '';
        const rows = [
          ['impressions', fmt.format(impressions[idx])],
          ['parents', String(parents[idx].length)],
          ['children', String(children[idx].length)],
          ['ancestors', String(ancestors.size - 1)],
          ['descendants', String(descendants.size - 1)],
          ['top parents', parentLabels],
          ['top children', childLabels],
        ];
        for (const [k, v] of rows) {
          const dt = document.createElement('dt');
          dt.textContent = k;
          const dd = document.createElement('dd');
          dd.textContent = v;
          panelKv.appendChild(dt);
          panelKv.appendChild(dd);
        }
        panel.style.display = 'block';
      }

      renderer.on('clickNode', ({ node }) => highlight(node));
      renderer.on('clickStage', () => clearHighlight());
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') clearHighlight();
      });
    }

    boot().catch((err) => {
      const el = document.getElementById('loader-detail');
      if (el) el.textContent = 'error: ' + (err && err.message ? err.message : err);
      console.error(err);
    });
  </script>
</body>
</html>
