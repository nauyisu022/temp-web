const TAG_CLASS = {
  shipping:'tag-shipping', returns:'tag-returns',
  customer_service:'tag-customer_service', store_intro:'tag-store_intro',
  disclaimers:'tag-disclaimers', warnings:'tag-warnings',
};
const TAG_LABEL = {
  shipping:'📦物流', returns:'↩退換', customer_service:'💬客服',
  store_intro:'🏪店铺', disclaimers:'⚠免責', warnings:'⛔警告',
};

function reasonTags(reason) {
  return reason.split(', ').map(r => {
    const cls = TAG_CLASS[r] || '';
    const lbl = TAG_LABEL[r] || r;
    return cls ? `<span class="rtag ${cls}">${lbl}</span>` : '';
  }).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 建立 ruleMap
const ruleMap = new Map();
const firstReason = ITEM.lines.find(l => l.action === 'deleted')?.reason || '';
for (const ln of ITEM.lines) {
  if (ln.action === 'deleted') {
    const key = (ln.text || '').trim().slice(0, 40);
    if (key) ruleMap.set(key, ln.reason);
  }
}

// 左栏：word diff + 标签
const diffResult = Diff.diffWords(ITEM.original, ITEM.cleaned);
let origHtml = '';
let pendingRemoved = '';
for (const part of diffResult) {
  if (part.removed) {
    pendingRemoved += part.value;
  } else {
    if (pendingRemoved) {
      let tags = '';
      for (const [k, reason] of ruleMap) {
        if (pendingRemoved.includes(k)) { tags = reasonTags(reason); break; }
      }
      if (!tags && firstReason) tags = reasonTags(firstReason);
      origHtml += `<del class="word-del">${esc(pendingRemoved)}</del>${tags}`;
      pendingRemoved = '';
    }
    if (!part.added) origHtml += esc(part.value);
  }
}
if (pendingRemoved) origHtml += `<del class="word-del">${esc(pendingRemoved)}</del>${reasonTags(firstReason)}`;
origHtml = origHtml.replace(/\n/g, '<br>');
document.getElementById('origBody').innerHTML = `<div style="line-height:1.9">${origHtml}</div>`;

// 右栏
document.getElementById('cleanBody').innerHTML =
  `<div style="white-space:pre-wrap;line-height:1.9">${esc(ITEM.cleaned)}</div>`;
