    const COUNTS = {"unreviewed": 160};

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function fillRegionSelect() {
      const select = document.getElementById('region-filter');
      const regions = [...new Set(CASES.map(row => row.region))].sort();
      for (const region of regions) {
        const option = document.createElement('option');
        option.value = region;
        option.textContent = region;
        select.appendChild(option);
      }
    }

    function verdictClass(verdict) {
      if (verdict === 'new_better') return 'good';
      if (verdict === 'old_better') return 'bad';
      return 'mid';
    }

    function termsToHtml(terms) {
      if (!terms || !terms.length) return '<span class="helper">空</span>';
      return `<div class="term-list">${terms.map(term => `<div class="term-item">${escapeHtml(term)}</div>`).join('')}</div>`;
    }

    function buildCard(row) {
      return `
        <article class="case-card">
          <div class="case-head">
            <div>
              <div class="meta">${escapeHtml(row.region)} / ${escapeHtml(row.item_id)}</div>
              <h3>${escapeHtml(row.original_title)}</h3>
            </div>
            <div class="tag-row">
              <span class="tag ${verdictClass(row.verdict)}">${escapeHtml(row.verdict)}</span>
              <span class="tag mid">Jaccard ${Number(row.llm_terms_jaccard).toFixed(3)}</span>
            </div>
          </div>
          <div class="compare-grid">
            <div class="compare-box">
              <div class="compare-label">Old Title</div>
              <div class="compare-text">${escapeHtml(row.old_title)}</div>
            </div>
            <div class="compare-box">
              <div class="compare-label">New Title</div>
              <div class="compare-text">${escapeHtml(row.new_title)}</div>
            </div>
          </div>
          <div class="compare-grid">
            <div class="term-box">
              <div class="compare-label">Old Kept Terms</div>
              ${termsToHtml(row.old_terms)}
            </div>
            <div class="term-box">
              <div class="compare-label">New Kept Terms</div>
              ${termsToHtml(row.new_terms)}
            </div>
          </div>
          <div class="compare-grid">
            <div class="compare-box">
              <div class="compare-label">Review Reason</div>
              <div class="compare-text">${escapeHtml(row.reason || '')}</div>
            </div>
            <div class="compare-box">
              <div class="compare-label">Quick Facts</div>
              <div class="compare-text">
                old_terms=${row.old_term_count} / new_terms=${row.new_term_count}<br>
                title_len_delta=${row.title_len_delta >= 0 ? '+' : ''}${row.title_len_delta}<br>
                title_exact=${row.title_exact_match ? 'yes' : 'no'} / term_exact=${row.llm_terms_exact_match ? 'yes' : 'no'}
              </div>
            </div>
          </div>
          <div class="desc">${escapeHtml(row.description_preview)}</div>
        </article>
      `;
    }

    function matchText(row, keyword) {
      if (!keyword) return true;
      const hay = [
        row.item_id,
        row.original_title,
        row.old_title,
        row.new_title,
        row.reason,
        ...(row.old_terms || []),
        ...(row.new_terms || []),
      ].join(' ').toLowerCase();
      return hay.includes(keyword.toLowerCase());
    }

    function renderCases() {
      const verdict = document.getElementById('verdict-filter').value;
      const region = document.getElementById('region-filter').value;
      const keyword = document.getElementById('case-search').value.trim();
      const rows = CASES.filter(row =>
        (!verdict || row.verdict === verdict) &&
        (!region || row.region === region) &&
        matchText(row, keyword)
      );
      const grid = document.getElementById('case-grid');
      const empty = document.getElementById('empty-state');
      document.getElementById('case-count').textContent =
        `当前显示 ${rows.length} 条。全量：new_better=${COUNTS.new_better || 0} / old_better=${COUNTS.old_better || 0} / similar=${COUNTS.similar || 0}`;
      if (!rows.length) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      grid.innerHTML = rows.map(buildCard).join('');
    }

    fillRegionSelect();
    for (const id of ['verdict-filter', 'region-filter', 'case-search']) {
      document.getElementById(id).addEventListener('input', renderCases);
      document.getElementById(id).addEventListener('change', renderCases);
    }
    renderCases();
  </script>
