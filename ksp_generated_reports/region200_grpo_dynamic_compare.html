<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Region200 Dynamic GRPO Compare</title>
  <style>
    :root {
      --bg: #f4efe7;
      --paper: #fffaf3;
      --ink: #1d1a17;
      --muted: #6f675d;
      --line: #d9cfbf;
      --gemini: #145a52;
      --v9: #9a5a23;
      --step25: #1f4f8a;
      --step100: #7a2f4f;
      --shadow: 0 22px 60px rgba(27, 20, 12, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(20,90,82,0.10), transparent 18%),
        radial-gradient(circle at 90% 14%, rgba(122,47,79,0.10), transparent 20%),
        linear-gradient(180deg, #f8f4ed 0%, var(--bg) 100%);
      font-family: "Iowan Old Style", "Noto Serif TC", "PingFang TC", serif;
    }
    .shell { max-width: 1540px; margin: 0 auto; padding: 28px 24px 72px; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
      gap: 22px;
      align-items: end;
      padding-bottom: 26px;
      border-bottom: 1px solid rgba(29,26,23,0.10);
    }
    .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
    h1 { margin: 10px 0 0; font-size: 56px; line-height: 0.97; letter-spacing: -0.04em; }
    .hero p { margin: 14px 0 0; color: var(--muted); line-height: 1.8; max-width: 62ch; }
    .hero-note {
      padding: 18px;
      background: rgba(255,250,243,0.82);
      border: 1px solid rgba(29,26,23,0.08);
      box-shadow: var(--shadow);
    }
    .hero-note strong { display: block; margin-bottom: 10px; font-size: 20px; }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .stat-card, .region-card, .toolbar, details.case {
      background: rgba(255,250,243,0.82);
      border: 1px solid rgba(29,26,23,0.08);
      box-shadow: var(--shadow);
    }
    .stat-card { padding: 16px; }
    .stat-card span, .stat-card small { display: block; color: var(--muted); }
    .stat-card b { display: block; margin-top: 8px; font-size: 28px; line-height: 1; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-top: 34px; }
    .section-head h2 { margin: 0; font-size: 30px; line-height: 1.1; }
    .section-head p { margin: 8px 0 0; color: var(--muted); }
    .switch-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .reward-toggle, .model-toggle {
      height: 40px;
      padding: 0 14px;
      border: 1px solid rgba(29,26,23,0.12);
      background: rgba(255,255,255,0.56);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    .reward-toggle.active, .model-toggle.active {
      color: #fff;
      background: var(--ink);
      border-color: var(--ink);
    }
    .region-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }
    .region-card { padding: 18px; }
    .region-card h3 { margin: 0; font-size: 26px; }
    .region-card .count { margin-top: 6px; color: var(--muted); }
    .region-lines { display: grid; gap: 8px; margin-top: 12px; font-size: 14px; }
    .region-lines div { display: flex; justify-content: space-between; gap: 12px; }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(280px, 1.4fr) 0.4fr 0.55fr;
      gap: 10px;
      margin-top: 24px;
      padding: 14px;
      backdrop-filter: blur(10px);
      background: rgba(244,239,231,0.90);
    }
    .toolbar input, .toolbar select {
      height: 46px;
      width: 100%;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: rgba(255,250,243,0.92);
      color: var(--ink);
      font: inherit;
    }
    .result-line { margin-top: 12px; color: var(--muted); font-size: 14px; }
    .case-list { display: grid; gap: 16px; margin-top: 18px; }
    details.case summary { list-style: none; cursor: pointer; padding: 18px; }
    details.case summary::-webkit-details-marker { display: none; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 6px 10px;
      border: 1px solid rgba(29,26,23,0.12);
      background: rgba(255,255,255,0.46);
      font-size: 12px;
    }
    .chip.good { color: var(--gemini); border-color: rgba(20,90,82,0.22); }
    .chip.warn { color: #9a3412; border-color: rgba(154,52,18,0.22); }
    .case-title { margin: 12px 0 0; font-size: 26px; line-height: 1.2; }
    .summary-text { margin-top: 10px; color: var(--muted); line-height: 1.75; max-width: 90ch; }
    .case-body { padding: 0 18px 18px; }
    .source-card {
      padding: 16px;
      background: rgba(255,255,255,0.38);
      border: 1px solid rgba(29,26,23,0.06);
    }
    .source-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .panel-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
    .panel {
      padding: 16px;
      border: 1px solid rgba(29,26,23,0.07);
      background: rgba(255,255,255,0.48);
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .panel-title { font-size: 22px; line-height: 1.1; }
    .panel-badge {
      padding: 6px 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #fff;
    }
    .badge-gemini { background: var(--gemini); }
    .badge-v9 { background: var(--v9); }
    .badge-step25 { background: var(--step25); }
    .badge-step100 { background: var(--step100); }
    .field-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.65;
      font-family: "SFMono-Regular", "Menlo", monospace;
    }
    .json-grid { display: grid; gap: 10px; margin-top: 14px; }
    .json-block { border-top: 1px solid rgba(29,26,23,0.08); padding-top: 12px; }
    .json-block pre {
      max-height: 260px;
      overflow: auto;
      padding: 12px;
      border: 1px solid rgba(29,26,23,0.08);
      background: rgba(255,255,255,0.52);
    }
    .load-more {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 18px;
      margin-top: 20px;
      border: 1px solid rgba(29,26,23,0.12);
      background: rgba(255,250,243,0.82);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .hidden { display: none !important; }
    @media (max-width: 1220px) {
      .hero { grid-template-columns: 1fr; }
      .panel-grid { grid-template-columns: 1fr; }
      .region-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .shell { padding: 20px 14px 48px; }
      h1 { font-size: 40px; }
      .toolbar { grid-template-columns: 1fr; }
      .source-grid { grid-template-columns: 1fr; }
      .region-grid { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <div class="eyebrow">Region200 JSON Browser</div>
        <h1>一条一页，只看 `analysis / final` JSON</h1>
        <p>这里不再做报表汇总，只保留单条样本浏览。筛选结果集之后，一次只展示一个 item，按左右方向键或按钮翻页。</p>
      </div>
      <aside class="hero-note">
        <strong>交互说明</strong>
        <div>左方向键上一条，右方向键下一条。</div>
        <div style="margin-top:8px;">修改搜索、地区或状态后，会自动跳到当前结果集的第一条。</div>
      </aside>
    </section>

    <section>
      <div class="section-head">
        <div>
          <h2>筛选</h2>
          <p>按 `item_id`、标题或描述搜索，并按地区或 `step25` 状态过滤。</p>
        </div>
      </div>
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="按 item、标题、描述搜索">
        <select id="regionFilter">
          <option value="ALL">全部地区</option>
        </select>
        <select id="statusFilter">
          <option value="ALL">全部 step25 状态</option>
          <option value="closed">只看 step25 完整</option>
          <option value="truncated">只看 step25 截断</option>
          <option value="analysis_only">只看 step25 只有 analysis</option>
        </select>
      </div>

      <div class="section-head" style="margin-top: 18px;">
        <div>
          <h2>当前样本</h2>
          <p id="resultLine">正在加载…</p>
        </div>
        <div class="switch-row">
          <button class="model-toggle" id="prevBtn">上一条</button>
          <button class="model-toggle" id="nextBtn">下一条</button>
        </div>
      </div>
      <section id="singleCase"></section>
    </section>
  </main>

  <script>
    const DATA_URL = "region200_grpo_dynamic_compare.data.json";
    const MODEL_BADGE_CLASS = {
      gemini: 'badge-gemini',
      new_v9: 'badge-v9',
      step25_tuned_gate_v4: 'badge-step25',
      step100_v9_grpo_max1024: 'badge-step100',
    };
    const MODEL_STATUS_LABEL = {
      structured: '结构化基线',
      closed: 'final 完整',
      truncated: 'final 截断',
      analysis_only: '只有 analysis',
    };
    const state = {
      search: '',
      region: 'ALL',
      status: 'ALL',
      currentIndex: 0,
      payload: null,
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function buildModelPanel(spec, model) {
      return `
        <article class="panel">
          <div class="panel-head">
            <div class="panel-title">${escapeHtml(spec.label)}</div>
            <div class="panel-badge ${MODEL_BADGE_CLASS[spec.id]}">${escapeHtml(MODEL_STATUS_LABEL[model.status] || model.status_label || model.status)}</div>
          </div>
          <div class="json-grid">
            <div class="json-block">
              <div class="field-label">Analysis JSON</div>
              <pre>${escapeHtml(model.analysis_json || '无')}</pre>
            </div>
            <div class="json-block">
              <div class="field-label">Final JSON</div>
              <pre>${escapeHtml(model.final_json || model.preview || '无')}</pre>
            </div>
          </div>
        </article>
      `;
    }

    function getFilteredItems(payload) {
      const region = state.region;
      const status = state.status;
      const query = state.search.trim().toLowerCase();
      return payload.records.filter((record) => {
        if (region !== 'ALL' && record.region !== region) return false;
        if (status !== 'ALL' && record.models.step25_tuned_gate_v4.status !== status) return false;
        if (query && !record.search.includes(query)) return false;
        return true;
      });
    }

    function shortText(text, limit) {
      const normalized = String(text || '').replace(/\s+/g, ' ').trim();
      return normalized.length <= limit ? normalized : normalized.slice(0, limit - 1) + '…';
    }

    function populateRegionFilter(payload) {
      const regionFilter = document.getElementById('regionFilter');
      regionFilter.innerHTML = '<option value="ALL">全部地区</option>' +
        Object.keys(payload.summary.by_region).map((region) => `<option value="${region}">${region}</option>`).join('');
    }

    function renderSingleCase(payload) {
      const items = getFilteredItems(payload);
      const total = items.length;
      const singleCase = document.getElementById('singleCase');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      if (!total) {
        singleCase.innerHTML = '<article class="panel"><div class="panel-title">当前筛选条件下没有样本</div></article>';
        document.getElementById('resultLine').textContent = '当前筛选结果 0 条';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }
      if (state.currentIndex >= total) state.currentIndex = total - 1;
      if (state.currentIndex < 0) state.currentIndex = 0;
      const record = items[state.currentIndex];
      const panels = payload.model_specs.map((spec) => buildModelPanel(spec, record.models[spec.id])).join('');
      singleCase.innerHTML = `
        <article class="source-card">
          <div class="meta-row">
            <span class="chip">${escapeHtml(record.region)}</span>
            <span class="chip">${escapeHtml(record.item_id)}</span>
            <span class="chip good">旧 judge 胜者: ${escapeHtml(record.judge_winner)}</span>
            <span class="chip warn">step25: ${escapeHtml(record.models.step25_tuned_gate_v4.status_label)}</span>
          </div>
          <div class="case-title">${escapeHtml(record.title)}</div>
          <div class="summary-text">${escapeHtml(record.category)} · ${escapeHtml(record.category_path)}<br>${escapeHtml(record.judge_summary || shortText(record.description, 220))}</div>
          <div class="source-grid" style="margin-top: 16px;">
            <div>
              <div class="label">Description</div>
              <pre>${escapeHtml(record.description)}</pre>
            </div>
            <div>
              <div class="label">Judge Summary</div>
              <pre>${escapeHtml(record.judge_summary || '无')}</pre>
            </div>
          </div>
        </article>
        <div class="panel-grid">${panels}</div>
      `;
      document.getElementById('resultLine').textContent = `当前第 ${state.currentIndex + 1} / ${total} 条`;
      prevBtn.disabled = state.currentIndex <= 0;
      nextBtn.disabled = state.currentIndex >= total - 1;
    }

    function moveCase(step) {
      if (!state.payload) return;
      const total = getFilteredItems(state.payload).length;
      if (!total) return;
      state.currentIndex = Math.max(0, Math.min(total - 1, state.currentIndex + step));
      renderSingleCase(state.payload);
    }

    function render() {
      if (!state.payload) return;
      renderSingleCase(state.payload);
    }

    async function init() {
      const response = await fetch(DATA_URL);
      state.payload = await response.json();
      populateRegionFilter(state.payload);
      document.getElementById('searchInput').addEventListener('input', (event) => {
        state.search = event.target.value;
        state.currentIndex = 0;
        render();
      });
      document.getElementById('regionFilter').addEventListener('change', (event) => {
        state.region = event.target.value;
        state.currentIndex = 0;
        render();
      });
      document.getElementById('statusFilter').addEventListener('change', (event) => {
        state.status = event.target.value;
        state.currentIndex = 0;
        render();
      });
      document.getElementById('prevBtn').addEventListener('click', () => {
        moveCase(-1);
      });
      document.getElementById('nextBtn').addEventListener('click', () => {
        moveCase(1);
      });
      document.addEventListener('keydown', (event) => {
        const tagName = document.activeElement && document.activeElement.tagName;
        if (tagName === 'INPUT' || tagName === 'SELECT' || tagName === 'TEXTAREA') return;
        if (event.key === 'ArrowRight') {
          moveCase(1);
        } else if (event.key === 'ArrowLeft') {
          moveCase(-1);
        }
      });
      render();
    }

    init();
  </script>
</body>
</html>
