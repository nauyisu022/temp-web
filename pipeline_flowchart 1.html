<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Title Optimization v9 Pipeline</title>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Virgil', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif; background: #fff; }
  #canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const dpr = window.devicePixelRatio || 1;
const W = 1420, H = 1500;
const canvas = document.getElementById('canvas');
canvas.width = W * dpr; canvas.height = H * dpr;
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
const ctx = canvas.getContext('2d');
ctx.scale(dpr, dpr);
const rc = rough.canvas(canvas);
const S = 42;

const C = {
  input:   '#e8f0fe',
  select:  '#fff3e0',
  ksp:     '#fce4ec',
  info:    '#e8f0fe',
  search:  '#e8f5e9',
  sim:     '#e8f5e9',
  sort:    '#f3e5f5',
  llm:     '#e3f2fd',
  pattern: '#fff8e1',
  ek:      '#fff3e0',
  filter:  '#fce4ec',
  output:  '#e8f5e9',
  white:   '#fff',
  dataBg:  '#f5f5f5',
};

function rect(x, y, w, h, fill, opts) {
  rc.rectangle(x, y, w, h, { roughness: 1, strokeWidth: 1.5, fill, fillStyle: 'solid', seed: S, ...opts });
}

function text(str, x, y, { font = '14px', bold = false, color = '#222', align = 'center' } = {}) {
  ctx.fillStyle = color;
  ctx.font = (bold ? 'bold ' : '') + font + ' "Virgil", "Segoe Print", "Comic Sans MS", cursive';
  ctx.textAlign = align;
  ctx.fillText(str, x, y);
}

function arrow(x1, y1, x2, y2, opts = {}) {
  const o = { roughness: 0.7, strokeWidth: 1.5, seed: S, ...opts };
  rc.line(x1, y1, x2, y2, o);
  const a = Math.atan2(y2 - y1, x2 - x1), sz = 9;
  rc.line(x2, y2, x2 - sz * Math.cos(a - 0.4), y2 - sz * Math.sin(a - 0.4), o);
  rc.line(x2, y2, x2 - sz * Math.cos(a + 0.4), y2 - sz * Math.sin(a + 0.4), o);
}

function line(x1, y1, x2, y2, opts = {}) {
  rc.line(x1, y1, x2, y2, { roughness: 0.7, strokeWidth: 1.5, seed: S, ...opts });
}

function pill(str, x, y, w, fill = C.white) {
  rect(x, y, w, 24, fill);
  text(str, x + w / 2, y + 16, { font: '9px' });
}

function laneFrame(title, subtitle, x, y, w, h, fill, stroke = '#666', titleColor = '#222') {
  rect(x, y, w, h, fill, { stroke, strokeWidth: 2.5 });
  text(title, x + 20, y + 30, { font: '18px', bold: true, color: titleColor, align: 'left' });
  if (subtitle) text(subtitle, x + 20, y + 47, { font: '11px', color: '#666', align: 'left' });
}

// ── Layout constants ──
const laneW = 400;
const laneTop = 270;
const laneH = 520;
const mergeY = 805;
const c1 = 230, c2 = 710, c3 = 1190;
const lane1X = c1 - laneW / 2;
const lane2X = c2 - laneW / 2;
const lane3X = c3 - laneW / 2;
const boxW = 400;
const smallW = 300;

// ── Title ──
text('Title Optimization v9', W / 2, 42, { font: '28px', bold: true });

// ── Inputs band and shared product selection ──
const inputsY = 90;
rect(W / 2 - 250, inputsY, 500, 56, C.input);
text('Inputs', W / 2, inputsY + 24, { font: '16px', bold: true });
text('item catalog · ads performance · historical title knowledge', W / 2, inputsY + 43, { font: '11px', color: '#666' });

const productSelectionY = 180;
const productSelectionW = 460, productSelectionH = 60;
rect(W / 2 - productSelectionW / 2, productSelectionY, productSelectionW, productSelectionH, C.select, { stroke: '#fb8c00', strokeWidth: 2 });
text('Product Selection', W / 2, productSelectionY + 24, { font: '17px', bold: true });
text('Choosing Items with CPO Improvement Space', W / 2, productSelectionY + 45, { font: '11px', color: '#666' });
arrow(W / 2, inputsY + 56, W / 2, productSelectionY, { stroke: '#fb8c00', strokeWidth: 2 });

// ── Parallel lanes ──
laneFrame('Search Terms Processing', 'performance search terms → simulator → sorting', lane1X, laneTop, laneW, laneH, C.search, '#00897b', '#00796b');
laneFrame('KSP Extraction', 'trained RL model · 2-step inference', lane2X, laneTop, laneW, laneH, C.ksp, '#c62828', '#c62828');
laneFrame('Knowledge & Pattern', 'offline clusters → title patterns → expert knowledge', lane3X, laneTop, laneW, laneH, C.pattern, '#fb8c00', '#fb8c00');

// shared selection fan-out into all three lanes
const fanoutY = laneTop - 18;
line(W / 2, productSelectionY + productSelectionH, W / 2, fanoutY, { stroke: '#fb8c00', strokeWidth: 2 });
line(c1, fanoutY, c3, fanoutY, { stroke: '#fb8c00', strokeWidth: 2 });
arrow(c1, fanoutY, c1, laneTop, { stroke: '#fb8c00', strokeWidth: 2 });
arrow(c2, fanoutY, c2, laneTop, { stroke: '#fb8c00', strokeWidth: 2 });
arrow(c3, fanoutY, c3, laneTop, { stroke: '#fb8c00', strokeWidth: 2 });

// ══════════════════════════════════════════════════════════════
// Lane 1: Search Terms Processing
// ══════════════════════════════════════════════════════════════
const l1InputY = 325;
const inputBoxW = 140;
const inputBoxH = 60;
const leftCol = c1 - 105;
const rightCol = c1 + 105;

// Two parallel inputs at top of Lane 1: Item Document (left) + Search Terms (right)
rect(leftCol - inputBoxW / 2, l1InputY, inputBoxW, inputBoxH, C.input);
text('Product', leftCol, l1InputY + 24, { font: '13px', bold: true });
text('(title · description · attrs)', leftCol, l1InputY + 43, { font: '9px', color: '#666' });

rect(rightCol - inputBoxW / 2, l1InputY, inputBoxW, inputBoxH, C.input);
text('Search Terms', rightCol, l1InputY + 24, { font: '13px', bold: true });
text('(with ads performance)', rightCol, l1InputY + 43, { font: '9px', color: '#666' });

const simY = 410;
const ssW = 370, ssH = 290;
rect(c1 - ssW / 2, simY, ssW, ssH, C.white);
text('Search Simulator', c1, simY + 26, { font: '17px', bold: true });

const wsY = simY + 48;
rect(c1 - 170, wsY, 130, 28, C.white);
text('Word Segmentation', leftCol, wsY + 18, { font: '10px' });
rect(c1 + 40, wsY, 130, 28, C.white);
text('Word Segmentation', rightCol, wsY + 18, { font: '10px' });

// Parallel arrows: each top input → its own Word Segmentation
arrow(leftCol, l1InputY + inputBoxH, leftCol, wsY);
arrow(rightCol, l1InputY + inputBoxH, rightCol, wsY);

const iiY = simY + 105;
rect(c1 - 175, iiY, 350, 70, C.white);
text('Inverted Index', c1, iiY + 18, { font: '12px', bold: true });
rect(c1 - 145, iiY + 25, 130, 38, C.input);
text('BM25', c1 - 80, iiY + 40, { font: '12px', bold: true });
text('Sparse · Lexical', c1 - 80, iiY + 56, { font: '9px', color: '#555' });
rect(c1 + 15, iiY + 25, 130, 38, C.input);
text('Qwen3 Embedding', c1 + 80, iiY + 40, { font: '11px', bold: true });
text('Dense · Semantic', c1 + 80, iiY + 56, { font: '9px', color: '#555' });
arrow(leftCol, wsY + 28, c1 - 80, iiY);
arrow(rightCol, wsY + 28, c1 + 80, iiY);

const srY = iiY + 78;
rect(c1 - 90, srY, 180, 32, C.white);
text('Similarity Recall', c1, srY + 21, { font: '12px' });
arrow(c1, iiY + 70, c1, srY);

const rrY = srY + 52;
rect(c1 - 120, rrY, 240, 40, C.white);
text('Relevance Re-ranking', c1, rrY + 17, { font: '12px' });
text('(Qwen3 Reranker · Fine-tuned)', c1, rrY + 32, { font: '10px', color: '#c62828' });
arrow(c1, srY + 32, c1, rrY);

// Good / Bad split (after Relevance Re-ranking)
const splitY = 725;
const splitH = 50;
const splitW = 130;
const splitOffset = 80;

// Good — kept (green)
rect(c1 - splitOffset - splitW / 2, splitY, splitW, splitH, C.white, { stroke: '#2e7d32', strokeWidth: 1.5 });
text('Good', c1 - splitOffset, splitY + 22, { font: '13px', bold: true, color: '#2e7d32' });
text('(high-relevance)', c1 - splitOffset, splitY + 40, { font: '9px', color: '#666' });

// Bad — discarded (muted)
rect(c1 + splitOffset - splitW / 2, splitY, splitW, splitH, C.dataBg, { stroke: '#bbb', strokeWidth: 1.2 });
text('Bad', c1 + splitOffset, splitY + 22, { font: '13px', bold: true, color: '#999' });
text('(discarded)', c1 + splitOffset, splitY + 40, { font: '9px', color: '#999' });

// Split fan from Simulator bottom
const fanY = splitY - 15;
line(c1, simY + ssH, c1, fanY, { stroke: '#666', strokeWidth: 1.5 });
line(c1 - splitOffset, fanY, c1 + splitOffset, fanY, { stroke: '#666', strokeWidth: 1.5 });
arrow(c1 - splitOffset, fanY, c1 - splitOffset, splitY, { stroke: '#2e7d32', strokeWidth: 1.5 });
arrow(c1 + splitOffset, fanY, c1 + splitOffset, splitY, { stroke: '#bbb', strokeWidth: 1.2 });

// Lane 1: Good → mergeY (down then right, single bend at bottom — meets lateral merge at mergeY)
line(c1 - splitOffset, splitY + splitH, c1 - splitOffset, mergeY, { stroke: '#00897b', strokeWidth: 2 });
line(c1 - splitOffset, mergeY, c1, mergeY, { stroke: '#00897b', strokeWidth: 2 });

// ══════════════════════════════════════════════════════════════
// Lane 2: KSP Extraction
// ══════════════════════════════════════════════════════════════
const kspY = 454;
const kspW = 350, kspH = 320;
rect(c2 - kspW / 2, kspY, kspW, kspH, C.white);
text('Product KSP Extraction', c2, kspY + 24, { font: '16px', bold: true });
text('Trained RL Model · 2-step', c2, kspY + 43, { font: '11px', bold: true, color: '#c62828' });

const stepX = c2 - kspW / 2 + 24;
const stepW = kspW - 48;
let sy = kspY + 58;

// Step 1 · Analyze & Plan
const s1H = 120;
rect(stepX, sy, stepW, s1H, C.white);
text('Step 1 · Analyze & Plan', c2, sy + 22, { font: '12px', bold: true });
text('— user profile & search intent', stepX + 28, sy + 46, { font: '10px', color: '#444', align: 'left' });
text('— target market language', stepX + 28, sy + 64, { font: '10px', color: '#444', align: 'left' });
text('— product fact judgment', stepX + 28, sy + 82, { font: '10px', color: '#444', align: 'left' });
text('— search keyword value assessment', stepX + 28, sy + 100, { font: '10px', color: '#444', align: 'left' });
sy += s1H;

arrow(c2, sy, c2, sy + 20);
sy += 20;

// Step 2 · Generate KSP
const s2H = 64;
rect(stepX, sy, stepW, s2H, C.white);
text('Step 2 · Generate KSP', c2, sy + 22, { font: '12px', bold: true });
text('— extract brand · product type · USP · long-tail keywords', c2, sy + 46, { font: '10px', color: '#444' });
sy += s2H;

sy += 20;
const outLabels = ['Brand', 'Product Type', 'USP', 'Long-tail KW'];
const olW = 76, olGap = 6;
const olTotalW = outLabels.length * olW + (outLabels.length - 1) * olGap;
let olX = c2 - olTotalW / 2;
for (const lb of outLabels) {
  pill(lb, olX, sy, olW);
  olX += olW + olGap;
}
const infoY = 330;
rect(c2 - 190, infoY, 380, 94, C.info);
text('Product Information', c2, infoY + 22, { font: '14px', bold: true });
rect(c2 - 170, infoY + 36, 155, 42, C.white);
text('Original Title', c2 - 92, infoY + 52, { font: '10px' });
text('+ Description', c2 - 92, infoY + 67, { font: '10px' });
rect(c2 + 15, infoY + 36, 155, 42, C.white);
text('Original Title', c2 + 92, infoY + 52, { font: '10px' });
text('+ KSP', c2 + 92, infoY + 67, { font: '10px' });
arrow(c2, infoY + 94, c2, kspY);

// Lane 2 Output box removed — KSP frame's pills below act as the visible output

// ══════════════════════════════════════════════════════════════
// Lane 3: Knowledge & Pattern
// ══════════════════════════════════════════════════════════════
const l3InputY = 325;
rect(c3 - smallW / 2, l3InputY, smallW, 56, C.input);
text('historical titles + KSP', c3, l3InputY + 24, { font: '13px', bold: true });
text('good / bad examples by category', c3, l3InputY + 43, { font: '10px', color: '#666' });

const clusterY = 400;
rect(c3 - 170, clusterY, 340, 64, C.white);
text('Cluster by', c3, clusterY + 24, { font: '14px', bold: true });
rect(c3 - 70, clusterY + 34, 140, 22, C.white);
text('Product Type', c3, clusterY + 49, { font: '10px' });
arrow(c3, l3InputY + 56, c3, clusterY);

const tpY = 500;
rect(c3 - 170, tpY, 340, 126, C.white);
text('Title Pattern Generation', c3, tpY + 23, { font: '15px', bold: true });
text('offline', c3 + 125, tpY + 23, { font: '9px', bold: true, color: '#fb8c00' });
rect(c3 - 145, tpY + 38, 290, 26, C.white);
text('Mining Good / Bad Title Examples', c3, tpY + 56, { font: '10px' });
rect(c3 - 145, tpY + 72, 290, 26, C.white);
text('Pattern Generation (LLM & CoT)', c3, tpY + 90, { font: '10px' });
text('→ SQLite DB', c3, tpY + 114, { font: '9px', color: '#999' });
arrow(c3, clusterY + 64, c3, tpY);

const ekY = 660;
rect(c3 - 160, ekY, 320, 118, C.white);
text('Expert Knowledge', c3, ekY + 24, { font: '15px', bold: true });
text('by cluster priority:', c3, ekY + 45, { font: '11px', color: '#555' });
text('1. Product Type', c3, ekY + 64, { font: '11px', color: '#555' });
text('2. L3 Category', c3, ekY + 82, { font: '11px', color: '#555' });
text('3. L2 Category', c3, ekY + 100, { font: '11px', color: '#555' });
arrow(c3, tpY + 126, c3, ekY);

// Lane 3 Output box removed — Expert Knowledge box above acts as the visible output

// ══════════════════════════════════════════════════════════════
// Convergence: three lane outputs feed directly into LLM Title Generator
// ══════════════════════════════════════════════════════════════
const llmY = 830;
const llmW = 620, llmH = 180;
const llmX = W / 2 - llmW / 2;

// lane outputs merge cleanly before entering LLM Title Generator (mergeY hoisted to layout constants above)
const mergeLeft = llmX + 120;
const mergeRight = llmX + llmW - 120;
line(c2, kspY + kspH, c2, mergeY, { stroke: '#c62828', strokeWidth: 2 });
line(c3, ekY + 118, c3, mergeY, { stroke: '#fb8c00', strokeWidth: 2 });
line(mergeLeft, mergeY, mergeRight, mergeY, { stroke: '#666', strokeWidth: 2 });
line(c1, mergeY, mergeLeft, mergeY, { stroke: '#00897b', strokeWidth: 2 });
line(c3, mergeY, mergeRight, mergeY, { stroke: '#fb8c00', strokeWidth: 2 });
arrow(W / 2, mergeY, W / 2, llmY, { stroke: '#666', strokeWidth: 2.2 });

rect(llmX, llmY, llmW, llmH, C.llm, { stroke: '#1565c0', strokeWidth: 2 });
text('LLM Title Generator', W / 2, llmY + 26, { font: '18px', bold: true });

rect(llmX + 25, llmY + 42, llmW - 50, 54, C.white);
text('Call 1: Extract Facts + Policy', W / 2, llmY + 60, { font: '13px', bold: true });
text('brand · product_type · specs · core_usp · signals', W / 2, llmY + 77, { font: '11px', color: '#c62828' });
text('→ select policy (max_len, structure rules)', W / 2, llmY + 91, { font: '11px', color: '#666' });

text('+', W / 2, llmY + 113, { font: '17px', bold: true, color: '#1565c0' });

rect(llmX + 25, llmY + 124, llmW - 50, 38, C.white);
text('Call 2: Generate Optimized Title', W / 2, llmY + 139, { font: '13px', bold: true });
// Call 2 input chain — colored by source lane (Lane 2 red / internal gray / Lane 1 green / Lane 3 orange)
{
  ctx.font = '11px "Virgil", "Segoe Print", "Comic Sans MS", cursive';
  ctx.textAlign = 'left';
  const segs = [
    { t: 'facts', c: '#c62828' },
    { t: ' + policy', c: '#666' },
    { t: ' + search terms', c: '#00796b' },
    { t: ' + expert knowledge', c: '#fb8c00' },
    { t: '  →  N candidates', c: '#666' },
  ];
  let totW = 0;
  for (const s of segs) totW += ctx.measureText(s.t).width;
  let sx = W / 2 - totW / 2;
  for (const s of segs) {
    ctx.fillStyle = s.c;
    ctx.fillText(s.t, sx, llmY + 154);
    sx += ctx.measureText(s.t).width;
  }
}

text('GPT-5-mini · async · concurrency=200', W / 2, llmY + 174, { font: '11px', color: '#888' });

// ══════════════════════════════════════════════════════════════
// Candidate selection: LLM N candidates → best title
// ══════════════════════════════════════════════════════════════
const candY = llmY + llmH + 14;
const candW = 100, candH = 28;
const candXs = [W / 2 - 220, W / 2 - candW / 2, W / 2 + 120];
const candLabels = ['Candidate 1', 'Candidate 2', 'Candidate N'];
for (let i = 0; i < candXs.length; i++) {
  rect(candXs[i], candY, candW, candH, C.white, { stroke: '#6a1b9a', strokeWidth: 1.2 });
  text(candLabels[i], candXs[i] + candW / 2, candY + 18, { font: '9px', bold: true, color: '#6a1b9a' });
}
text('...', W / 2 + 85, candY + 18, { font: '13px', bold: true, color: '#777' });

const selectY = 1080;
const selectW = 620, selectH = 145;
const selectX = W / 2 - selectW / 2;
rect(selectX, selectY, selectW, selectH, C.sort, { stroke: '#6a1b9a', strokeWidth: 2 });
text('Multi-candidate Selection', W / 2, selectY + 24, { font: '16px', bold: true, color: '#6a1b9a' });
text('score and verify N candidates → select the best one', W / 2, selectY + 43, { font: '10px', color: '#666' });

const evalY = selectY + 60;
line(candXs[0] + candW / 2, candY + candH, candXs[0] + candW / 2, selectY - 12, { stroke: '#6a1b9a', strokeWidth: 1.4 });
line(candXs[1] + candW / 2, candY + candH, candXs[1] + candW / 2, selectY - 12, { stroke: '#6a1b9a', strokeWidth: 1.4 });
line(candXs[2] + candW / 2, candY + candH, candXs[2] + candW / 2, selectY - 12, { stroke: '#6a1b9a', strokeWidth: 1.4 });
line(candXs[0] + candW / 2, selectY - 12, candXs[2] + candW / 2, selectY - 12, { stroke: '#6a1b9a', strokeWidth: 1.4 });
arrow(W / 2, selectY - 12, W / 2, selectY, { stroke: '#6a1b9a', strokeWidth: 1.4 });

rect(W / 2 - 250, evalY, 230, 42, C.white);
text('DAG Search-term Scoring', W / 2 - 135, evalY + 17, { font: '11px', bold: true });
text('relevance · good/bad terms', W / 2 - 135, evalY + 33, { font: '9px', color: '#666' });
rect(W / 2 + 20, evalY, 230, 42, C.white);
text('Facts / EK Validation', W / 2 + 135, evalY + 17, { font: '11px', bold: true });
text('facts · policy · expert knowledge', W / 2 + 135, evalY + 33, { font: '9px', color: '#666' });

const bestY = selectY + 116;
rect(W / 2 - 85, bestY, 170, 24, C.output, { stroke: '#2e7d32', strokeWidth: 1.5 });
text('Best Candidate', W / 2, bestY + 16, { font: '10px', bold: true, color: '#2e7d32' });
arrow(W / 2, evalY + 42, W / 2, bestY, { stroke: '#6a1b9a', strokeWidth: 1.5 });
arrow(W / 2, llmY + llmH, W / 2, candY);

// ══════════════════════════════════════════════════════════════
// Final flow: selection → Blacklist Filter → Enhanced Title
// ══════════════════════════════════════════════════════════════
const filterY = 1270;
rect(W / 2 - 175, filterY, 350, 68, C.filter);
text('Blacklist Filter', W / 2, filterY + 22, { font: '15px', bold: true });
text('flashtext (Aho-Corasick) · CJK cleanup', W / 2, filterY + 42, { font: '10px', color: '#666' });
text('Google GMC Policy Compliance', W / 2, filterY + 57, { font: '10px', color: '#666' });
arrow(W / 2, selectY + selectH, W / 2, filterY);

const outY = 1390;
rect(W / 2 - 120, outY, 240, 48, C.output, { stroke: '#2e7d32', strokeWidth: 2 });
text('Enhanced Title', W / 2, outY + 20, { font: '15px', bold: true, color: '#2e7d32' });
text('→ Hive (Parquet)', W / 2, outY + 38, { font: '11px', color: '#555' });
arrow(W / 2, filterY + 68, W / 2, outY);
text('BR · ID · MY · PH · SG · TH · TW · VN', W / 2, outY + 68, { font: '11px', color: '#aaa' });

</script>
</body>
</html>
